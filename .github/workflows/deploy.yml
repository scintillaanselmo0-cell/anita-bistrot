name: Pubblica sito su GitHub Pages

# Si avvia ad ogni push sul ramo principale, o manualmente dal tab "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi necessari per pubblicare su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita pubblicazioni sovrapposte.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genera il sito statico
        run: npm run build

      # Dominio personalizzato: mantiene il collegamento ad ogni pubblicazione.
      # Se NON usi un dominio tuo, elimina questa riga (userai l'indirizzo .github.io).
      - name: Imposta dominio
        run: echo "www.anitabistrot.it" > dist/CNAME

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito generato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
